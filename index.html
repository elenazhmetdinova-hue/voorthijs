<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart"></span><span class="heart"></span><span class="heart"></span>
    <span class="heart"></span><span class="heart"></span><span class="heart"></span>
    <span class="heart"></span><span class="heart"></span><span class="heart"></span>
    <span class="heart"></span><span class="heart"></span><span class="heart"></span>
  </div>

  <main class="card" role="main">
    <p class="badge">💌 Valentine Special</p>

    <h1>Hey <span id="nameTo">Thijs</span>…</h1>
    <p class="subtitle">I made you a tiny website because I’m cheesy like that.</p>

    <section class="question">
      <h2 id="questionTitle">Will you be my Valentine? 💖</h2>

      <div class="btn-area" id="btnArea">
        <button class="btn yes" id="yesBtn">Yes 😍</button>
        <button class="btn no" id="noBtn">No 🙃</button>
      </div>

      <p class="hint" id="hint">Try pressing “No”… if you can 😇</p>
    </section>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>

      <button class="btn note" id="noteBtn">Open small note 💌</button>

      <div class="note" id="note" hidden></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

</html>
